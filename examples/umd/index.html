<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>xlsx-now UMD PoC</title>
<!-- The whole point of the UMD build: classic <script> tags, no module type, no
     import map, no bundler. Nothing is inlined, so each file is loaded before
     the one that reads it off the global it publishes: fflate as window.fflate,
     the writer as window.xlsxNow, and the browser helpers — which are a second
     bundle, not a second copy of the writer — as window.xlsxNowBrowser. -->
<script src="/node_modules/fflate/umd/index.js"></script>
<script src="/dist/umd/xlsx-now.umd.js"></script>
<script src="/dist/umd/xlsx-now-browser.umd.js"></script>
</head>
<body>
<h1>xlsx-now — UMD (script tag) PoC</h1>
<p>Same core writer and same browser helpers as the ESM example, loaded as plain globals.</p>
<button id="generate">Generate &amp; download</button>
<p id="status"></p>
<script>
const columns = [
    { name: 'id', key: 'id', pk: true },
    { name: 'name', key: 'name' },
    { name: 'price', key: 'price' },
    { name: 'in_stock', key: 'inStock' },
];

async function* simulateUpstreamRows(count) {
    for (let i = 1; i <= count; i++) {
        yield { id: i, name: `Widget ${i}`, price: Math.round(i * 3.33 * 100) / 100, inStock: i % 5 !== 0 };
        if (i % 25 === 0) await new Promise((r) => setTimeout(r, 0));
    }
}

function generateXlsxBlob(rowCount = 200) {
    return window.xlsxNowBrowser.createXlsxBlob({
        columns,
        rows: simulateUpstreamRows(rowCount),
        sheetName: 'Widgets',
    });
}

document.getElementById('generate').addEventListener('click', () => {
    const status = document.getElementById('status');
    status.textContent = 'Generating...';
    // `downloadXlsx` streams straight to disk through the File System Access
    // API when the browser has it, and falls back to a Blob download where it
    // does not — the same helper the ESM example uses, reached here as a global.
    window.xlsxNowBrowser
        .downloadXlsx('example-umd.xlsx', {
            columns,
            rows: simulateUpstreamRows(200),
            sheetName: 'Widgets',
        })
        .then((route) => {
            status.textContent =
                route === 'file-system-access' ? 'Done (streamed to disk).' : 'Done (Blob fallback).';
        })
        .catch((err) => {
            console.error(err);
            status.textContent = `Error: ${err && err.message ? err.message : String(err)}`;
        });
});

// Exposed for automated testing (see examples/browser/run-in-chromium-test.ts).
window.__generateXlsxBlob = generateXlsxBlob;
</script>
</body>
</html>
