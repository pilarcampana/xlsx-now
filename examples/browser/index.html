<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>xlsx-now browser example</title>
</head>
<body>
<h1>xlsx-now — browser example</h1>
<p>Generates a styled .xlsx (bold headers, highlighted PK column) client-side from a simulated streaming data source.</p>
<button id="generate">Generate &amp; download</button>
<p id="status"></p>
<!-- Resolves the bare "client-zip" specifier used inside src/index.js.
     A bundler would normally handle this; this demo runs without one. -->
<script type="importmap">
{
  "imports": {
    "client-zip": "/node_modules/client-zip/index.js"
  }
}
</script>
<script type="module" src="/examples/browser/app.js"></script>
</body>
</html>
