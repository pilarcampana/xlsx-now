<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>xlsx-now browser PoC</title>
<!-- Resolves the one bare specifier the core imports ("fflate", the zip
     container) without pulling in a bundler. -->
<script type="importmap">
{
  "imports": {
    "fflate": "/node_modules/fflate/esm/browser.js"
  }
}
</script>
</head>
<body>
<h1>xlsx-now — browser PoC</h1>
<p>Generates a styled .xlsx (bold headers, highlighted PK column) client-side from a simulated streaming data source.</p>
<button id="generate">Generate &amp; download</button>
<p id="status"></p>
<script type="module" src="/dist/examples/browser/app.js"></script>
</body>
</html>
